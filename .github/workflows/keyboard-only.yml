name: Keyboard-only (ASCII)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run check:ascii -- --all
